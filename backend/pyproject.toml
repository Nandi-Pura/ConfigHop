[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confighop-core"
version = "0.5.1"
description = "ConfigHop Palo Alto XML source inventory core"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
