[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "confighop-core"
version = "0.2.0"
description = "ConfigHop Palo Alto XML source inventory core"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "defusedxml>=0.7,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
