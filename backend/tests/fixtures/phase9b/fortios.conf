config system interface
    edit "port1"
        set type physical
        set ip 203.0.113.2 255.255.255.252
    next
    edit "port2"
        set type physical
        set ip 10.0.0.1 255.255.255.0
    next
end
config system zone
    edit "WAN"
        set interface "port1"
    next
    edit "LAN"
        set interface "port2"
    next
end
config firewall address
    edit "CLIENTS"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "PUBLIC"
        set subnet 203.0.113.100 255.255.255.255
    next
end
config firewall addrgrp
    edit "CLIENT_GROUP"
        set member "CLIENTS"
    next
end
config firewall service custom
    edit "TCP_8443"
        set protocol TCP/UDP/SCTP
        set tcp-portrange 8443
    next
end
config firewall service group
    edit "WEB_GROUP"
        set member "TCP_8443"
    next
end
config firewall ippool
    edit "OUTBOUND"
        set type overload
        set startip 203.0.113.2
        set endip 203.0.113.2
    next
end
config firewall vip
    edit "WEB_VIP"
        set extintf "port1"
        set extip 203.0.113.100
        set mappedip 10.0.0.100
    next
end
config firewall policy
    edit 1
        set name "Outbound Web"
        set srcintf "LAN"
        set dstintf "WAN"
        set srcaddr "CLIENT_GROUP"
        set dstaddr "all"
        set service "WEB_GROUP"
        set action accept
        set schedule "always"
        set nat enable
        set ippool enable
        set poolname "OUTBOUND"
        set logtraffic all
    next
    edit 2
        set name "Inbound Web"
        set srcintf "WAN"
        set dstintf "LAN"
        set srcaddr "all"
        set dstaddr "WEB_VIP"
        set service "TCP_8443"
        set action accept
        set schedule "always"
    next
    edit 3
        set name "Disabled Deny"
        set srcintf "WAN"
        set dstintf "LAN"
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set action deny
        set status disable
        set schedule "always"
    next
end
config router static
    edit 1
        set dst 0.0.0.0 0.0.0.0
        set gateway 203.0.113.1
        set device "port1"
    next
end
