! ConfigHop limited IOS XE 17.12 -> AOS-CX 10.15 candidate
! Review findings before deployment; no device validation performed.
hostname LAB-SWITCH
vlan 10
    name USERS
exit
vlan 20
    name SERVERS
exit
vlan 99
    name MANAGEMENT
exit
spanning-tree mode rpvst
spanning-tree
spanning-tree vlan 10,20,99
spanning-tree vlan 10,20,99 priority 8
lldp
aaa authentication login default local
ntp server 192.0.2.10
ntp enable
access-list ip LAB-ACL
    10 permit any any any
exit
interface lag 10
    no shutdown
    no routing
    vlan trunk native 99
    vlan trunk allowed 10,20,99
    lacp mode active
exit
interface vlan 99
    no shutdown
    ip address 192.0.2.2/24
    apply access-list ip LAB-ACL routed-in
exit
interface 1/1/10
    no shutdown
    no routing
    vlan trunk native 99
    vlan trunk allowed 10,20,99
exit
interface 1/1/24
    description Lab user
    no shutdown
    no routing
    vlan access 10
    spanning-tree port-type admin-edge
    spanning-tree bpdu-guard
exit
interface 1/1/48
    no shutdown
    no routing
    vlan access 20
exit
interface 1/1/7
    no shutdown
    lag 10
exit
interface 1/1/8
    no shutdown
    lag 10
exit
ip route 0.0.0.0/0 192.0.2.1
